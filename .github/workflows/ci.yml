name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: Cache Bend and Lean
        id: toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.bend
            ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-bend-lean-v1-${{ hashFiles('.bend-version', 'lean-toolchain') }}
      - name: Set toolchain PATH
        run: |
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Bend
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          version="$(cat .bend-version)"
          curl -fsSL "https://github.com/bendlang/bend/releases/download/v${version}/bend-${version}-linux-x64.tar.gz" -o /tmp/bendo-bend.tar.gz
          mkdir -p "$HOME/.bend"
          tar -xzf /tmp/bendo-bend.tar.gz -C "$HOME/.bend" --strip-components=1
      - name: Install Lean through elan
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o /tmp/bendo-elan-init.sh
          sh /tmp/bendo-elan-init.sh -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache compiled fixtures
        uses: actions/cache@v4
        with:
          path: .cache/bend
          key: ${{ runner.os }}-${{ runner.arch }}-fixtures-v1-${{ hashFiles('**/*.bend', '**/*.c', '**/*.js', '.bend-version', 'tests/harness.ts') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fixtures-v1-
      - name: Quality gate
        run: timeout --foreground 12m bun run check
