name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Proofs, lint and typechecks. `bun run check` runs these plus the tests;
  # CI splits them so the test job gets its full budget.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Cache Bend and Lean
        id: toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.bend
            ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-bend-lean-v1-${{ hashFiles('.bend-version', 'lean-toolchain') }}
      - name: Set toolchain PATH
        run: |
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Bend
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          version="$(cat .bend-version)"
          curl -fsSL "https://github.com/bendlang/bend/releases/download/v${version}/bend-${version}-linux-x64.tar.gz" -o /tmp/bendo-bend.tar.gz
          mkdir -p "$HOME/.bend"
          tar -xzf /tmp/bendo-bend.tar.gz -C "$HOME/.bend" --strip-components=1
      - name: Install Lean through elan
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o /tmp/bendo-elan-init.sh
          sh /tmp/bendo-elan-init.sh -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Proofs, lint and typechecks
        run: timeout --foreground 12m bun run check:static

  # Builds the docs site (BND-70). Fails on a broken internal link, a page
  # missing from the sidebar, or a broken include. See docs/SITE.md.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the docs site
        run: timeout --foreground 5m bun run check:docs

  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BENDO_TEST_SHARD: ${{ matrix.shard }}
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: Cache Bend and Lean
        id: toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.bend
            ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-bend-lean-v1-${{ hashFiles('.bend-version', 'lean-toolchain') }}
      - name: Set toolchain PATH
        run: |
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Bend
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          version="$(cat .bend-version)"
          curl -fsSL "https://github.com/bendlang/bend/releases/download/v${version}/bend-${version}-linux-x64.tar.gz" -o /tmp/bendo-bend.tar.gz
          mkdir -p "$HOME/.bend"
          tar -xzf /tmp/bendo-bend.tar.gz -C "$HOME/.bend" --strip-components=1
      - name: Install elan without a Lean toolchain
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o /tmp/bendo-elan-init.sh
          sh /tmp/bendo-elan-init.sh -y --no-modify-path --default-toolchain none
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Guard shard assignment
        run: bun run test:shards
      - name: Check the Bend pin
        run: bun run check:bend
      - name: Fingerprint the native toolchain
        id: toolchain
        run: echo "id=$(printf '%s %s' "${ImageVersion:-unknown}" "$(clang --version | head -1)" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Restore and save separately so a run that times out still keeps the
      # fixtures it compiled; the retry then starts warm.
      - name: Restore compiled fixtures
        id: fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/bend
            .cache/test-timings.json
          key: ${{ runner.os }}-${{ runner.arch }}-fixtures-v2-${{ steps.toolchain.outputs.id }}-shard-${{ matrix.shard }}-${{ hashFiles('**/*.bend', '**/*.c', '**/*.js', 'tests/**/*.ts', 'prototypes/**/*.json', 'scripts/*.ts', 'scripts/test-timings.json', 'package.json', '.bend-version') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fixtures-v2-${{ steps.toolchain.outputs.id }}-shard-${{ matrix.shard }}-
            ${{ runner.os }}-${{ runner.arch }}-fixtures-v2-${{ steps.toolchain.outputs.id }}-
            ${{ runner.os }}-${{ runner.arch }}-fixtures-v2-
            ${{ runner.os }}-${{ runner.arch }}-fixtures-v1-${{ steps.toolchain.outputs.id }}-
      - name: Tests
        run: bun run test:ci
      - name: Save compiled fixtures
        if: always() && steps.fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/bend
            .cache/test-timings.json
          key: ${{ steps.fixtures.outputs.cache-primary-key }}
      - name: Per-file test timings
        if: always()
        run: |
          if test -f .cache/test-timings.json; then
            cat .cache/test-timings.json
          fi

  # Hello-world throughput budget (BND-68). Builds the pinned baseline commit
  # and this commit on one runner, measures them in alternating pairs, and
  # fails when the median candidate/baseline ratio is below the threshold in
  # bench/perf-baseline.json. See bench/README.md.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      # This job installs Bend without Lean, so it keeps its own cache key.
      # Sharing the static job's Bend-and-Lean key would let a cold perf run
      # save a cache that static then restores without Lean.
      - name: Cache Bend
        id: toolchains
        uses: actions/cache@v4
        with:
          path: ~/.bend
          key: ${{ runner.os }}-${{ runner.arch }}-bend-only-v1-${{ hashFiles('.bend-version') }}
      - name: Set toolchain PATH
        run: echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install pinned Bend
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          version="$(cat .bend-version)"
          curl -fsSL "https://github.com/bendlang/bend/releases/download/v${version}/bend-${version}-linux-x64.tar.gz" -o /tmp/bendo-bend.tar.gz
          mkdir -p "$HOME/.bend"
          tar -xzf /tmp/bendo-bend.tar.gz -C "$HOME/.bend" --strip-components=1
      - name: Check the Bend pin
        run: bun run check:bend
      - name: Install oha
        run: |
          curl -fLsS https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64 -o /tmp/oha
          sudo install -m 755 /tmp/oha /usr/local/bin/oha
      - name: Check out the baseline commit
        run: git worktree add --detach /tmp/perf-baseline "$(jq -r .commit bench/perf-baseline.json)"
      - name: Build the baseline and candidate servers
        run: |
          fixture="$(jq -r .fixture bench/perf-baseline.json)"
          (cd /tmp/perf-baseline && bend "$fixture" -o /tmp/perf-baseline.c)
          clang -std=c11 -O3 /tmp/perf-baseline.c -o /tmp/perf-baseline-server -lpthread -lm
          bend "$fixture" -o /tmp/perf-candidate.c
          clang -std=c11 -O3 /tmp/perf-candidate.c -o /tmp/perf-candidate-server -lpthread -lm
      - name: Measure
        run: bun bench/budget.ts run --baseline /tmp/perf-baseline-server --candidate /tmp/perf-candidate-server --out perf-budget.json
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget
          path: perf-budget.json
          if-no-files-found: ignore
