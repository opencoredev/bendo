name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | BEND_NO_TELEMETRY=1 sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - run: bun install
      - name: Proofs
        run: bend PROOF.bend
      - run: bun run typecheck
      - run: bun run test
