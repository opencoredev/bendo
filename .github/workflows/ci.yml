name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/bendo-bend-install.sh
          sh /tmp/bendo-bend-install.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Validate pinned Bend version
        run: bun run check:bend
      - name: Install Lean through elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o /tmp/bendo-elan-init.sh
          sh /tmp/bendo-elan-init.sh -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
      - run: bun install --frozen-lockfile
      - run: timeout --foreground 10m bun run check
